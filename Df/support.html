<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدعم الفني المباشر - شبكة ستار اللاسلكية</title>
    <style>
        :root {
            --primary-color: #15213b; /* اللون الأزرق الداكن الأساسي */
            --secondary-color: #00f7ff; /* اللون الأزرق الفاتح (النيون) */
            --secondary-dark: #007f7f; /* نسخة داكنة من اللون الثانوي */
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--primary-color);
            margin: 0;
            padding: 0;
            color: white;
        }
        
        .support-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.2);
            border: 1px solid var(--secondary-color);
        }
        
        .logo {
            height: 50px;
            filter: drop-shadow(0 0 5px var(--secondary-color));
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
            background: var(--secondary-dark);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(0, 247, 255, 0.3);
        }
        
        .nav-btn:hover {
            background: var(--secondary-color);
            color: var(--primary-color);
            box-shadow: 0 0 10px var(--secondary-color);
        }
        
        .support-title {
            text-align: center;
            margin: 20px 0;
            color: var(--secondary-color);
            text-shadow: 0 0 8px var(--secondary-color);
            font-size: 28px;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(21, 33, 59, 0.7);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.3);
            overflow: hidden;
            border: 1px solid var(--secondary-color);
        }
        
        .chat-header {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-dark));
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--secondary-color);
        }
        
        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--secondary-color);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-left: 15px;
            box-shadow: 0 0 10px var(--secondary-color);
        }
        
        .agent-info h4 {
            margin: 0;
            color: var(--secondary-color);
        }
        
        .agent-info p {
            margin: 0;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .chat-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--secondary-color);
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--secondary-color);
            margin-left: 5px;
            box-shadow: 0 0 5px var(--secondary-color);
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 300px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .message {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 18px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .received {
            align-self: flex-start;
            background: rgba(0, 247, 255, 0.1);
            border: 1px solid var(--secondary-dark);
            border-top-right-radius: 0;
            color: var(--secondary-color);
        }
        
        .sent {
            align-self: flex-end;
            background: var(--secondary-dark);
            color: white;
            border-top-left-radius: 0;
            border: 1px solid var(--secondary-color);
        }
        
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
        }
        
        .chat-input-area {
            border-top: 1px solid var(--secondary-dark);
            padding: 15px;
            display: flex;
            align-items: center;
            background: rgba(21, 33, 59, 0.9);
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--secondary-dark);
            border-radius: 25px;
            font-family: 'Tajawal', sans-serif;
            resize: none;
            height: 50px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 5px var(--secondary-color);
        }
        
        .send-btn {
            background: var(--secondary-dark);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(0, 247, 255, 0.3);
        }
        
        .send-btn:hover {
            background: var(--secondary-color);
            color: var(--primary-color);
            box-shadow: 0 0 10px var(--secondary-color);
        }
        
        .attachment-btn {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 20px;
            cursor: pointer;
            margin-right: 15px;
            transition: all 0.3s;
        }
        
        .attachment-btn:hover {
            color: white;
            transform: scale(1.1);
        }
        
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 20px;
            border-top: 1px solid var(--secondary-dark);
            background: rgba(21, 33, 59, 0.9);
        }
        
        .quick-action {
            background: rgba(0, 247, 255, 0.1);
            border: 1px solid var(--secondary-dark);
            border-radius: 15px;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            color: var(--secondary-color);
            transition: all 0.3s;
        }
        
        .quick-action:hover {
            background: var(--secondary-dark);
            color: white;
            border-color: var(--secondary-color);
            box-shadow: 0 0 5px var(--secondary-color);
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: var(--secondary-color);
            font-size: 14px;
            padding: 20px 0;
            text-shadow: 0 0 5px var(--secondary-color);
        }
        
        .typing-indicator {
            display: none;
            align-self: flex-start;
            margin-bottom: 15px;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--secondary-color);
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1s infinite;
            box-shadow: 0 0 3px var(--secondary-color);
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-5px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.5; }
        }
        
        /* تأثيرات النيون */
        .neon-text {
            text-shadow: 0 0 5px var(--secondary-color), 0 0 10px var(--secondary-color);
        }
        
        .neon-border {
            box-shadow: 0 0 5px var(--secondary-color), 0 0 10px rgba(0, 247, 255, 0.3);
        }
        
        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }
            
            .chat-input-area {
                padding: 10px;
            }
            
            .chat-input {
                height: 40px;
            }
            
            .send-btn {
                width: 40px;
                height: 40px;
            }
            
            .support-title {
                font-size: 22px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>

</body>
</html>
